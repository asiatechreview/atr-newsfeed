name = "atr-newsfeed"
compatibility_date = "2026-07-16"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "ATR_FEED_DB"
database_name = "atr-newsfeed-db"
database_id = "b02c4b49-922e-48d8-8c54-ceeedd76c41a"

# NOTE: cron triggers for the scheduled functions in functions/_scheduled.js
# cannot be declared here. Pages rejects [triggers] in wrangler.toml. Register
# them once in the Pages dashboard: Settings -> Functions -> Cron Triggers:
#   0 1 * * *     (newsletter card refresh)
#   */30 * * * *  (ingest reconciliation)
#   */10 * * * *  (health + deploy verification)
